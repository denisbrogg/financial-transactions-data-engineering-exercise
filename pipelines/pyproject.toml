[project]
name = "pipelines"
requires-python = ">=3.13,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.20",
    "dagster-dg-cli>=1.13.20",
    "dagster-duckdb>=0.29.20",
    "fastparquet>=2026.5.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipelines"
registry_modules = [
    "pipelines.components.*",
]


